requirement_task:
  description: >
    Analyze the new user requirements prompt: "{prompt}".
    Compare these new requirements with the existing SRS:
    "{existing_srs}"
    
    You MUST merge the new requirements, features, and changes from the user prompt into the existing SRS.
    For every single requirement (functional and non-functional), classify it into one of these categories:
    - [NEW]: Added by the current prompt.
    - [MODIFIED]: Modified or updated from the existing SRS by the current prompt.
    - [REMOVED]: Existed in the previous SRS but is now deprecated, obsolete, or explicitly deleted by the current prompt.
    - [UNCHANGED]: Exists in the previous SRS and is untouched by the current prompt.
    
    Format the requirement list clearly, prefixing each requirement with its classification tag (e.g., "- [UNCHANGED] The system shall...").
    If a requirement is [REMOVED], keep it in the list but mark it clearly as [REMOVED] so that downstream agents know it was deleted.
    
    You MUST output the entire updated markdown content of the SRS.md file.
    Do NOT output any conversational text, explanations, intro, outro, or markdown code blocks (e.g. do not wrap the output in ```markdown). Output ONLY the raw markdown of the file itself.
  expected_output: >
    The complete, raw markdown content of the updated SRS.md file containing the classified requirement lists. Absolutely no conversational filler, no code block backticks, just the raw file content.

impact_task:
  description: >
    Compare the newly updated SRS.md with the historical files: {existing_files_summary}.
    Analyze how the requirements delta impacts the existing codebase.
    Generate an Impact_Report.md detailing:
    1. Requirement Delta (what's new, changed, or removed).
    2. File Impact list (categorized into NEW, MODIFY, UNCHANGED).
    3. Precise refactoring/addition guidelines for the Development Agent, highlighting that unchanged files should NOT be touched.
    Do NOT wrap the output in markdown code blocks or add conversational preamble. Output ONLY the raw markdown content of the Impact_Report.md file.
  expected_output: >
    The complete, raw markdown content of the Impact_Report.md file. Absolutely no conversational filler, no code block backticks, just the raw file content.

design_task:
  description: >
    Review the SRS.md and the Impact_Report.md (if any).
    Generate or update the Design.md file.
    Outline:
    1. System Architecture overview.
    2. Module and Class Specifications (class names, methods, signatures, docstrings).
    3. Structural & Sequence flow (represented using Mermaid diagrams).
    Keep it strictly synchronized with the functional requirements and impact directions.
    Do NOT wrap the output in markdown code blocks or add conversational preamble. Output ONLY the raw markdown content of the Design.md file.
  expected_output: >
    The complete, raw markdown content of the Design.md file. Absolutely no conversational filler, no code block backticks, just the raw file content.

code_task:
  description: >
    Write, modify, or extend Python source code based on Design.md at {reports_dir}/Design.md and Impact_Report.md at {reports_dir}/Impact_Report.md.
    The project codebase is located at: {project_dir}.
    Follow these rules strictly:
    1. Review existing code files: {existing_source_code}.
    2. Only write new files or modify files marked for modification in the Impact_Report.md. Do NOT overwrite unchanged files.
    3. Maintain PEP-8 formatting, clear docstrings, and write modular, readable code.
    4. You MUST use the `write_project_file` tool to save each new or modified Python source file to `{project_dir}`. Do NOT just present the code in your final answer; you MUST write it to the filesystem.
  expected_output: >
    Complete, functional, and syntactically correct Python files in the {project_dir} directory.

testing_task:
  description: >
    Review the source code files in {project_dir} and the requirements in SRS.md at {reports_dir}/SRS.md.
    Generate or update a pytest suite inside the directory: {project_dir}/tests.
    Create/update files like `test_*.py`. Make sure the tests cover all functional requirements, boundary conditions, edge cases, and exception handling.
    Ensure test files import modules correctly and run independently.
    You MUST use the `write_project_file` tool to save the test files to `{project_dir}/tests`. Do NOT just present the test code in your final answer; you MUST write it to the filesystem.
  expected_output: >
    A complete pytest suite consisting of test_*.py files verifying the application correctness.

documentation_task:
  description: >
    Review the project source code in {project_dir}, the SRS.md at {reports_dir}/SRS.md, and the Design.md at {reports_dir}/Design.md.
    Create or update:
    1. {project_dir}/README.md: Installation guides, usage examples, feature list, and test runner instructions.
    2. {project_dir}/User_Manual.md: Detailed manual detailing how a user interacts with the app, with command-line or interface examples.
    You MUST use the `write_project_file` tool to save README.md and User_Manual.md to `{project_dir}`. Do NOT just present the documentation in your final answer; you MUST write it to the filesystem.
  expected_output: >
    Updated and professional README.md and User_Manual.md files under the project directory.
